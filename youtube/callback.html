<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting YouTube — tkws-studio</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 48px 16px; line-height: 1.6; color: #1d1f24; background: #fff; text-align: center; }
</style>
</head>
<body>
<h1>Connecting YouTube…</h1>
<p id="msg">Sending the sign-in result back to tkws-studio on this computer.</p>
<script>
  // Same bridge as TikTok: Google redirects here (https on GitHub Pages), then we hand the one-time
  // code to the local studio on localhost (the code is useless without the client secret kept there).
  var q = location.search || '';
  if (/[?&](code|error)=/.test(q)) location.replace('http://localhost:4001/api/scheduler/youtube/callback' + q);
  else document.getElementById('msg').textContent = 'Nothing to connect — open the Post Scheduler in tkws-studio and press "Connect YouTube".';
</script>
</body>
</html>
