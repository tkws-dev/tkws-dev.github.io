<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting TikTok — tkws-studio</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 48px 16px; line-height: 1.6; color: #1d1f24; background: #fff; text-align: center; }
</style>
</head>
<body>
<h1>Connecting TikTok…</h1>
<p id="msg">Sending the sign-in result back to tkws-studio on this computer.</p>
<script>
  // TikTok needs an https redirect address; the studio runs on this computer, so this page only hands the
  // one-time code over to the local studio server (the code is useless without the app secret kept there).
  var q = location.search || '';
  if (/[?&](code|error)=/.test(q)) location.replace('http://localhost:4001/api/scheduler/tiktok/callback' + q);
  else document.getElementById('msg').textContent = 'Nothing to connect — open the Post Scheduler in tkws-studio and press "Connect TikTok".';
</script>
</body>
</html>
